name: Keep warm

# Neon (plan gratuito) suspende la base de datos tras unos minutos sin uso y la
# primera visita después de eso puede tardar varios segundos o fallar. Este
# workflow hace una petición cada 5 minutos a un endpoint que consulta la base
# y a la portada, para que el demo responda al instante.
#
# Notas:
# - Los cron de GitHub Actions pueden retrasarse varios minutos en horas punta.
# - GitHub desactiva los workflows programados si el repositorio lleva 60 días
#   sin actividad; se reactivan desde la pestaña Actions.
# - Se puede lanzar a mano con "Run workflow" (workflow_dispatch).

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Despertar base de datos y app
        run: |
          set -e
          for u in "https://foodzinder.vercel.app/api/v1/restaurants?limit=1" "https://foodzinder.vercel.app/"; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -m 45 "$u")
            echo "$code $u"
            [ "$code" = "200" ] || exit 1
          done
